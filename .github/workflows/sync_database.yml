name: "Auto Sync BeybladeHub Parts Database"

on:
  schedule:
    # Runs every Monday at 04:00 AM Taipei time (UTC Sunday 20:00)
    - cron: '0 20 * * 0'
  workflow_dispatch:
    # Allows manual trigger at any time from GitHub Actions web interface

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run BeybladeHub Sync
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          ADMIN_LINE_USER_ID: ${{ secrets.ADMIN_LINE_USER_ID }}
        run: |
          python scripts/sync_beybladehub.py

      - name: Check for Changes and Commit
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          if [ -n "$(git status --porcelain data/parts_db.json web/static/images)" ]; then
            echo "New parts detected. Committing and pushing to repository..."
            git add data/parts_db.json web/static/images/
            git commit -m "chore(data): auto sync new parts from beybladehub.app [skip ci]"
            git push origin main
          else
            echo "No new parts found. Working tree is clean."
          fi
